[project]
name = "pennywise"
version = "0.1.0"
description = "Local-first UK credit card spending ledger: explains a bill from its statements, deterministically, for people and AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Fullbrook" }]
requires-python = ">=3.12"
keywords = [
    "credit-card",
    "personal-finance",
    "budgeting",
    "spending",
    "statements",
    "sqlite",
    "cli",
    "uk",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pypdf>=6.21.2",
]

[project.urls]
Homepage = "https://github.com/mfullbrook/pennywise"
Repository = "https://github.com/mfullbrook/pennywise"
Issues = "https://github.com/mfullbrook/pennywise/issues"
Changelog = "https://github.com/mfullbrook/pennywise/blob/main/CHANGELOG.md"

[project.scripts]
pennywise = "pennywise.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pennywise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# T20 bans print(): stdout belongs to the MCP protocol, and logs must not carry financial data.
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's rendering of long CHECK constraints.
"pennywise/migrations/versions/*" = ["E501"]
